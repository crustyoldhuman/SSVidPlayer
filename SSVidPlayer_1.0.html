<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSVidPlayer 1.0</title>
    <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHJlY3Qgd2lkdGg9IjI0IiBoZWlnaHQ9IjI0IiByeD0iNCIgZmlsbD0iIzMzMyIvPjxwb2x5Z29uIHBvaW50cz0iOSw3IDE4LDEyIDksMTciIGZpbGw9IndoaXRlIi8+PC9zdmc+" type="image/svg+xml">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #000000;
            color: #ffffff;
            flex-direction: column;
            font-family: sans-serif;
            overflow: hidden;
            transition: background-color 0.2s ease;
            position: relative; 
            z-index: 0;
        }
        body.drag-over {
            background-color: #1a1a1a;
        }
        .controls {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(20, 20, 20, 0.85);
            padding: 15px 25px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.4s ease;
        }
        .controls.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #filenameDisplay:empty {
            display: none;
        }
        .bottom-controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(20, 20, 20, 0.85);
            padding: 15px 25px;
            border-radius: 10px;
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.4s ease;
            width: 80%;
            max-width: 900px;
        }
        .bottom-controls.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #seekSlider {
            flex-grow: 1;
        }
        #timeDisplay {
            font-size: 14px;
            min-width: 100px;
            text-align: center;
            font-family: monospace;
        }
        .top-row {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: nowrap;
            justify-content: center;
            white-space: nowrap;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .bottom-row {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }
        .ui-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        select {
            background-color: #333333;
            color: #ffffff;
            border: 1px solid #666666;
            padding: 4px 8px;
            border-radius: 4px;
        }
        input[type="file"], input[type="range"], input[type="checkbox"] {
            color: #ffffff;
            cursor: pointer;
        }
        button, .custom-file-label {
            background-color: #333333;
            color: #ffffff;
            border: 1px solid #666666;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
            font-size: 13.33px; /* Matches default button text size */
            display: inline-block;
            box-sizing: border-box;
        }
        button:hover, .custom-file-label:hover {
            background-color: #555555;
        }
        video {
            background-color: #111111;
            position: relative;
            z-index: 2; 
        }

        #ambientCanvas {
            position: fixed; 
            top: 50%;
            left: 50%;
            width: 120vw;  
            height: 120vh;
            transform: translate(-50%, -50%);
            z-index: 1; 
            filter: blur(100px) saturate(150%) brightness(1.2); 
            opacity: 0.9; 
            pointer-events: none; 
            transition: opacity 0.5s ease;
        }
        #ambientCanvas.hidden {
            opacity: 0;
        }

        .play-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: default;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.2s ease;
            text-shadow: 0px 4px 12px rgba(0, 0, 0, 0.8);
        }
        .play-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .play-overlay.ready {
            cursor: pointer;
        }
        .play-overlay.ready:hover {
            transform: translate(-50%, -50%) scale(1.05);
        }
        .overlay-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .play-icon {
            font-size: 80px;
            line-height: 1;
            margin-bottom: 10px;
        }
        .play-text {
            font-size: 20px;
            font-weight: bold;
        }
        .spinner {
            border: 6px solid rgba(255, 255, 255, 0.2);
            border-top: 6px solid #ffffff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .toast {
            position: fixed;
            bottom: 120px;
            background-color: rgba(80, 80, 80, 0.9);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            z-index: 200;
            transition: opacity 0.5s ease, transform 0.5s ease;
            pointer-events: none;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.5);
        }
        .toast.hidden {
            opacity: 0;
            transform: translateY(20px);
        }
        .draggable-sub {
            position: fixed;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%) translate(0px, 0px);
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0px 4px 10px rgba(0,0,0,0.8);
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 16px;
            border-radius: 8px;
            cursor: grab;
            z-index: 60;
            user-select: none;
            pointer-events: auto;
        }
        .draggable-sub:empty {
            display: none;
        }

        .playback-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 150;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease, transform 0.5s ease;
            color: white;
        }
        .playback-indicator.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.1);
            transition: opacity 0.1s ease, transform 0.1s ease;
        }
        .playback-indicator svg {
            width: 40px;
            height: 40px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="controls" id="controlBar">
        <div class="top-row">
            <label for="videoFileInput" class="custom-file-label">Select Media...</label>
            <input type="file" id="videoFileInput" accept="video/*,audio/*,.srt" multiple style="display: none;">
            
            <div class="ui-group" id="subtitleContainer">
                <button id="btnSubtitles">Load Subtitles</button>
                <select id="subSelect" style="display: none;"></select>
                <div id="offsetGroup" style="display: none; align-items: center; gap: 5px;">
                    <label id="subSyncLabel" for="subOffset" style="font-size: 13px; user-select: none;">Sub-Sync:</label>
                    <span id="offsetSign" style="font-size: 16px; font-weight: bold; width: 12px; text-align: center; color: #ffffff; cursor: pointer; user-select: none;" title="Click to flip sign"></span>
                    <input type="number" id="subOffset" step="0.1" value="0" title="Offset in seconds" style="width: 50px; background-color: #333333; color: #ffffff; border: 1px solid #666666; border-radius: 4px; padding: 2px 4px;">
                    <span style="font-size: 13px;">s</span>
                </div>
                <input type="file" id="srtFileInput" accept=".srt" style="display: none;">
            </div>

            <div class="slider-container" style="display: flex; align-items: center; gap: 15px;">
                <div style="display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 8px;">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <label for="sizeSlider" style="font-size: small;" >Vid Size: <span id="scaleValue">1.00</span>x</label>
                        <input type="range" id="sizeSlider" min="0.5" max="5" step="0.05" value="1" style="width: 80px;">
                    </div>
                    <div id="subSizeGroup" style="display: none; align-items: center; gap: 10px;">
                        <label for="subSizeSlider" style="font-size: small;" >Sub Size: <span id="subScaleValue">1.00</span>x</label>
                        <input type="range" id="subSizeSlider" min="0.5" max="3" step="0.1" value="1.00" style="width: 80px;">
                    </div>
                </div>
            </div>
            
            <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
                <div class="ui-group">
                    <input type="checkbox" id="ambientToggle"> <label for="ambientToggle" style="cursor: pointer; user-select: none; margin-left: -4px;">Glow</label>
                </div>
                <div id="glowIntensityGroup" style="display: none;">
                    <input type="range" id="glowSlider" min="1" max="100" value="100" style="width: 65px;" title="Glow Intensity">
                </div>
            </div>

            <button id="btnCropToggle">Crop edges</button>
        </div>
        <div class="crop-row" id="cropControls" style="display: none; gap: 20px; align-items: center; justify-content: center; width: 100%; flex-wrap: wrap;">
            <div class="ui-group">
                <label>Top/Bottom (px):</label>
                <input type="number" id="cropTop" min="0" step="1" value="0" style="width: 55px; background-color: #333; color: #fff; border: 1px solid #666; border-radius: 4px; padding: 2px 4px;">
                <button id="linkTB" style="padding: 2px 6px; background-color: #555;" title="Unlink/Link">🔗</button>
                <input type="number" id="cropBottom" min="0" step="1" value="0" style="width: 55px; background-color: #333; color: #fff; border: 1px solid #666; border-radius: 4px; padding: 2px 4px;">
            </div>
            <div class="ui-group">
                <label>Left/Right (px):</label>
                <input type="number" id="cropLeft" min="0" step="1" value="0" style="width: 55px; background-color: #333; color: #fff; border: 1px solid #666; border-radius: 4px; padding: 2px 4px;">
                <button id="linkLR" style="padding: 2px 6px; background-color: #555;" title="Unlink/Link">🔗</button>
                <input type="number" id="cropRight" min="0" step="1" value="0" style="width: 55px; background-color: #333; color: #fff; border: 1px solid #666; border-radius: 4px; padding: 2px 4px;">
            </div>
        </div>
        <div id="filenameDisplay" style="font-size: 13px; color: #aaaaaa; text-align: center; margin-top: -5px; word-break: break-all; max-width: 90%;"></div>
    </div>

    <div id="playOverlay" class="play-overlay visible">
        <div id="overlayContent" class="overlay-content">
            <div class="play-text">Double-click here or drag and drop an .mp4 to load a video</div>
        </div>
    </div>

    <div id="subToast" class="toast hidden">Subtitles loaded</div>

    <div class="bottom-controls" id="bottomControlBar">
        <button id="btnPlayPause" style="width: 32px; height: 32px; padding: 0; display: inline-flex; align-items: center; justify-content: center;" title="Play/Pause">
            <svg id="iconPlay" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            <svg id="iconPause" style="display: none;" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
        </button>
        <button id="btnLoop" style="width: 32px; height: 32px; padding: 0; display: inline-flex; align-items: center; justify-content: center;" title="Toggle Repeat">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.3"/></svg>
        </button>
        <input type="range" id="seekSlider" min="0" max="100" value="0" step="0.1">
        <span id="timeDisplay">0:00 / 0:00</span>
        <div class="slider-container" style="margin-left: 10px; align-items: flex-end;">
            <span id="muteIcon" style="cursor: pointer; user-select: none; transition: opacity 0.2s; margin-bottom: 2px; display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px;" title="Mute/Unmute">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path id="volWaves" d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                    <line id="volMuteLine" x1="1" y1="3" x2="12" y2="21" style="display: none; stroke: #ff5555; stroke-width: 2;"></line>
                </svg>
            </span>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
                <label style="font-size: 13px; display: inline-block; width: 45px; text-align: center;"><span id="volumeValue">100</span>%</label>
                <input type="range" id="volumeSlider" min="0" max="3" step="0.01" value="1" style="width: 70px;">
            </div>
        </div>
        <button id="btnFit" style="width: 32px; height: 32px; padding: 0; display: inline-flex; align-items: center; justify-content: center;" title="Fit to Page">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="12" x2="2" y2="12"></line><polyline points="15 5 22 12 15 19"></polyline><polyline points="9 5 2 12 9 19"></polyline></svg>
        </button>
        <button id="btnFullscreen" style="width: 32px; height: 32px; padding: 0; display: inline-flex; align-items: center; justify-content: center;" title="Fullscreen">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
        </button>
    </div>

    <canvas id="ambientCanvas" class="hidden"></canvas>
    
    <video width="640" id="videoPlayer" muted>
        Your browser does not support the video tag.
    </video>
    <audio id="audioPlayer" style="display: none;"></audio>
    
    <div id="playbackIndicator" class="playback-indicator">
        <svg id="indicatorPlay" style="display: none; margin-left: 6px;" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        <svg id="indicatorPause" style="display: none;" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
    </div>

    <div id="customSubContainer" class="draggable-sub"></div>

    <script>
        const videoFileInput = document.getElementById('videoFileInput');
        const videoPlayer = document.getElementById('videoPlayer');
        const audioPlayer = document.getElementById('audioPlayer');
        const sizeSlider = document.getElementById('sizeSlider');
        const scaleValue = document.getElementById('scaleValue');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeValue = document.getElementById('volumeValue');
        const muteIcon = document.getElementById('muteIcon');
        const btnFit = document.getElementById('btnFit');
        const btnCropToggle = document.getElementById('btnCropToggle');
        const cropControls = document.getElementById('cropControls');
        const cropTop = document.getElementById('cropTop');
        const cropBottom = document.getElementById('cropBottom');
        const cropLeft = document.getElementById('cropLeft');
        const cropRight = document.getElementById('cropRight');
        const linkTB = document.getElementById('linkTB');
        const linkLR = document.getElementById('linkLR');
        const controlBar = document.getElementById('controlBar');
        const playOverlay = document.getElementById('playOverlay');
        const overlayContent = document.getElementById('overlayContent');
        const subtitleContainer = document.getElementById('subtitleContainer');
        const filenameDisplay = document.getElementById('filenameDisplay');
        const btnSubtitles = document.getElementById('btnSubtitles');
        const subSelect = document.getElementById('subSelect');
        const srtFileInput = document.getElementById('srtFileInput');
        const subToast = document.getElementById('subToast');
        const subOffset = document.getElementById('subOffset');
        const offsetGroup = document.getElementById('offsetGroup');
        const subSizeGroup = document.getElementById('subSizeGroup');
        const subSizeSlider = document.getElementById('subSizeSlider');
        const subScaleValue = document.getElementById('subScaleValue');
        const customSubContainer = document.getElementById('customSubContainer');
        
        const subStyle = document.createElement('style');
        document.head.appendChild(subStyle);
        const bottomControlBar = document.getElementById('bottomControlBar');
        const btnPlayPause = document.getElementById('btnPlayPause');
        const btnLoop = document.getElementById('btnLoop');
        const seekSlider = document.getElementById('seekSlider');
        const timeDisplay = document.getElementById('timeDisplay');
        const btnFullscreen = document.getElementById('btnFullscreen');
        
        let currentVideoUrl = null;
        let currentAudioUrl = null;
        let currentSrtUrl = null;
        let previousSubSelection = null; // Tracks memory of selections across UI updates
        let currentSyncOffset = 0; // Tracks the current active time shift applied to cues
        
        const ambientToggle = document.getElementById('ambientToggle');
        const glowIntensityGroup = document.getElementById('glowIntensityGroup');
        const glowSlider = document.getElementById('glowSlider');
        const ambientCanvas = document.getElementById('ambientCanvas');
        const ambientCtx = ambientCanvas.getContext('2d', { alpha: false });

        let isAmbientEnabled = false;
        let isFirstFrame = true;
        let ambientAnimId;

        let isLinkedTB = true;
        let isLinkedLR = true;

        // --- CUSTOM DRAGGABLE SUBTITLE LOGIC ---
        let isDraggingSub = false;
        let subDragStartX = 0, subDragStartY = 0;
        let subOffsetX = 0, subOffsetY = 0;

        customSubContainer.addEventListener('mousedown', (e) => {
            isDraggingSub = true;
            subDragStartX = e.clientX - subOffsetX;
            subDragStartY = e.clientY - subOffsetY;
            customSubContainer.style.cursor = 'grabbing';
            e.stopPropagation(); 
        });
        window.addEventListener('mousemove', (e) => {
            if (!isDraggingSub) return;
            subOffsetX = e.clientX - subDragStartX;
            subOffsetY = e.clientY - subDragStartY;
            customSubContainer.style.transform = `translateX(-50%) translate(${subOffsetX}px, ${subOffsetY}px)`;
        });
        window.addEventListener('mouseup', () => {
            isDraggingSub = false;
            customSubContainer.style.cursor = 'grab';
        });

        function renderCustomSubtitles(e) {
            const activeCues = e.target ? e.target.activeCues : e.activeCues;
            if (!activeCues || activeCues.length === 0) {
                customSubContainer.innerHTML = '';
                return;
            }
            let html = '';
            for (let i = 0; i < activeCues.length; i++) {
                html += activeCues[i].text.replace(/\n/g, '<br>') + '<br>';
            }
            customSubContainer.innerHTML = html;
        }

        btnCropToggle.addEventListener('click', () => {
            if (cropControls.style.display === 'none') {
                cropControls.style.display = 'flex';
            } else {
                cropControls.style.display = 'none';
            }
        });

        linkTB.addEventListener('click', () => {
            isLinkedTB = !isLinkedTB;
            linkTB.style.backgroundColor = isLinkedTB ? '#555' : '#333';
            if (isLinkedTB) { cropBottom.value = cropTop.value; applyVideoCrop(); }
        });

        linkLR.addEventListener('click', () => {
            isLinkedLR = !isLinkedLR;
            linkLR.style.backgroundColor = isLinkedLR ? '#555' : '#333';
            if (isLinkedLR) { cropRight.value = cropLeft.value; applyVideoCrop(); }
        });

        function applyVideoCrop() {
            if (videoPlayer.readyState === 0) return; // Abort if no video is loaded
            if (!nativeWidth || !nativeHeight) return;
            
            const cropT = parseFloat(cropTop.value) || 0;
            const cropR = parseFloat(cropRight.value) || 0;
            const cropB = parseFloat(cropBottom.value) || 0;
            const cropL = parseFloat(cropLeft.value) || 0;

            const t = cropT / nativeHeight * 100;
            const r = cropR / nativeWidth * 100;
            const b = cropB / nativeHeight * 100;
            const l = cropL / nativeWidth * 100;
            
            // FIX: If crop is 0, explicitly remove clip-path to restore the hardware overlay!
            if (cropT === 0 && cropR === 0 && cropB === 0 && cropL === 0) {
                videoPlayer.style.clipPath = 'none';
            } else {
                videoPlayer.style.clipPath = `inset(${t}% ${r}% ${b}% ${l}%)`;
            }
            
            updateVideoSize(sizeSlider.value); 
        }

        cropTop.addEventListener('input', (e) => { if(isLinkedTB) cropBottom.value = e.target.value; applyVideoCrop(); });
        cropBottom.addEventListener('input', (e) => { if(isLinkedTB) cropTop.value = e.target.value; applyVideoCrop(); });
        cropLeft.addEventListener('input', (e) => { if(isLinkedLR) cropRight.value = e.target.value; applyVideoCrop(); });
        cropRight.addEventListener('input', (e) => { if(isLinkedLR) cropLeft.value = e.target.value; applyVideoCrop(); });

        [cropTop, cropBottom, cropLeft, cropRight].forEach(input => {
            input.addEventListener('wheel', function(e) {
                e.preventDefault();
                e.deltaY < 0 ? this.stepUp() : this.stepDown();
                this.dispatchEvent(new Event('input')); 
            });
        });

        videoPlayer.addEventListener('seeked', () => {
        if (isAmbientEnabled) {
            isFirstFrame = true;
            if (videoPlayer.paused) drawAmbientFrame();
        }
    });

        let nativeWidth = 640;
        let nativeHeight = 360;
        let hideTimeout;
        let currentFitScale = 1;
        let audioCtx;
        let gainNode;

        window.addEventListener('load', () => {
        videoFileInput.value = '';
        ambientToggle.checked = false; // Forces the browser to forget past checkbox states
        isAmbientEnabled = false;
    });

        // --- SUBTITLE ENGINE REWRITE ---
        
        function removeManualTrack() {
            const trackElement = document.getElementById('manualSrtTrack');
            if (trackElement) {
                videoPlayer.removeChild(trackElement);
            }
            if (currentSrtUrl) {
                URL.revokeObjectURL(currentSrtUrl);
                currentSrtUrl = null;
            }
        }

        function applySubtitleSelection() {
            const tracks = videoPlayer.textTracks;
            
            // If user clicked "Load SRT", open file browser and revert dropdown visually
            if (subSelect.value === 'load') {
                subSelect.value = previousSubSelection || 'unload';
                srtFileInput.click();
                return;
            }
            
            const isNewSelection = previousSubSelection !== subSelect.value;
            previousSubSelection = subSelect.value;
            
            if (subSelect.value === 'unload') {

                    tracks[i].mode = 'hidden';

                offsetGroup.style.display = 'flex';
                if (subSizeGroup) subSizeGroup.style.display = 'flex';

                if (isNewSelection) {
                    subOffset.value = 0;
                    currentSyncOffset = 0;

                }
                
                for (let i = 0; i < tracks.length; i++) {
                    tracks[i].removeEventListener('cuechange', renderCustomSubtitles);
                    if (String(i) === subSelect.value) {
                        tracks[i].mode = 'hidden'; // Keeps native subtitles hidden
                        tracks[i].addEventListener('cuechange', renderCustomSubtitles);
                        renderCustomSubtitles({ target: tracks[i] }); // Render immediately
                    } else {

                    }
                }

        function updateSubtitleUI() {
            const tracks = videoPlayer.textTracks;
            let hasTracks = tracks && tracks.length > 0;

            if (hasTracks) {
                btnSubtitles.style.display = 'none';
                subSelect.style.display = 'block';
                
                const currentSelection = subSelect.value;
                subSelect.innerHTML = '';
                
                let manualIndex = -1;
                let nativelyShowingIndex = -1;
                
                // 1. Populate Available Tracks
                for (let i = 0; i < tracks.length; i++) {
                    const opt = document.createElement('option');
                    opt.value = i;
                    
                    if (tracks[i].label === 'Manual SRT') manualIndex = i;
                    if (tracks[i].mode === 'showing') nativelyShowingIndex = i;
                    
                    let trackLabel = tracks[i].label;
                    if (!trackLabel) {
                        trackLabel = tracks[i].language ? `Embedded Track (${tracks[i].language})` : `Embedded Track ${i + 1}`;
                    }
                    
                    opt.text = trackLabel;
                    subSelect.appendChild(opt);
                }
                
                // 2. Add standard Load / Unload options at the bottom
                const loadOpt = document.createElement('option');
                loadOpt.value = 'load';
                loadOpt.text = 'Load SRT...';
                subSelect.appendChild(loadOpt);
                
                const offOpt = document.createElement('option');
                offOpt.value = 'unload';
                offOpt.text = 'Unload / Off';
                subSelect.appendChild(offOpt);
                
                // 3. Smart Selection Logic
                // If they just loaded a manual track, force select it
                if (currentSelection === 'load' && manualIndex !== -1) {
                    subSelect.value = manualIndex;
                } 
                // If they had a previously valid selection, preserve it
                else if (currentSelection && currentSelection !== 'unload' && Array.from(subSelect.options).some(o => String(o.value) === String(currentSelection))) {
                    subSelect.value = currentSelection;
                } 
                // If a track is natively active and they didn't specifically unload it, use that
                else if (nativelyShowingIndex !== -1 && previousSubSelection !== 'unload') {
                    subSelect.value = nativelyShowingIndex;
                } 
                // If tracks exist and they didn't explicitly unload, default to the first track
                else if (tracks.length > 0 && previousSubSelection !== 'unload' && currentSelection !== 'unload') {
                    subSelect.value = 0; 
                } 
                // Otherwise, unload/hide everything
                else {

        function loadSrt(file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                let srtText = event.target.result;
                srtText = srtText.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').trim();
                const vttText = "WEBVTT\n\n" + srtText.replace(/(\d{1,2}:\d{2}:\d{2}),(\d{3})/g, (match, p1, p2) => {
                    let parts = p1.split(':');
                    if (parts[0].length === 1) parts[0] = '0' + parts[0];
                    return parts.join(':') + '.' + p2;
                });
                
                const blob = new Blob([vttText], { type: 'text/vtt' });
                removeManualTrack(); // Ensure we don't duplicate
                currentSrtUrl = URL.createObjectURL(blob);
                
                const track = document.createElement('track');
                track.id = 'manualSrtTrack';
                track.kind = 'subtitles';
                track.label = 'Manual SRT';
                track.srclang = 'en';
                track.src = currentSrtUrl;
                
                // Intercept the race condition by resetting the memory state
                // before the browser triggers the 'addtrack' event!
                previousSubSelection = 'load';
                subSelect.value = 'load';
                
                videoPlayer.appendChild(track);
                
                subToast.classList.remove('hidden');
                setTimeout(() => subToast.classList.add('hidden'), 2500);

                // (Browser addtrack event automatically handles UI refresh)
            };
            reader.readAsText(file);
        }

        function processVideoFiles(files) {
            if (!files || files.length === 0) return;

            let videoFile = null;
            let srtFile = null;

            for (let i = 0; i < files.length; i++) {
                if (files[i].type.startsWith('video/') || files[i].type.startsWith('audio/') || files[i].name.match(/\.(mkv|mp4|mp3|wav|ogg|flac)$/i)) {
                    videoFile = files[i];
                } else if (files[i].name.endsWith('.srt')) {
                    srtFile = files[i];

            }

            if (videoFile) {

                // createMediaElementSource breaks hardware overlays in Chromium, killing VSR.
                // if (!isFirefox) {

                removeManualTrack();

                }

                }

                // The video pipeline stays hardware-accelerated (VSR), while the audio pipeline gets hooked for volume.
                currentVideoUrl = URL.createObjectURL(videoFile);
                currentAudioUrl = URL.createObjectURL(videoFile);
                
                videoPlayer.src = currentVideoUrl;
                audioPlayer.src = currentAudioUrl;

                if (!audioCtx) initAudio();

        function applySyncOffset(newOffset) {
            const delta = newOffset - currentSyncOffset;
            if (delta === 0) return; 

            // 1. Update UI colors & symbols (forces the box to only show absolute value)
            if (newOffset === 0) {
                signSpan.innerText = '';

            } else {

                subOffset.value = Number(Math.abs(newOffset).toFixed(2));
            }
            
            lastInputValue = subOffset.value; // Store internal state for input tracking

            // 2. Shift the actual subtitle timing
            const tracks = videoPlayer.textTracks;
            const activeIndex = subSelect.value;
            
            if (activeIndex !== 'unload' && tracks[activeIndex] && tracks[activeIndex].cues) {
                const track = tracks[activeIndex];
                const cues = track.cues;

                // which causes cues to become permanently stuck in the activeCues list.
                track.mode = 'disabled'; 
                
                for (let i = 0; i < cues.length; i++) {
                    cues[i].startTime += delta;
                    cues[i].endTime += delta;
                }
                currentSyncOffset = newOffset;
                
                // Re-enable the track to cleanly re-evaluate the new timings
                track.mode = 'hidden'; 
                renderCustomSubtitles({ target: track });
            } else {
                currentSyncOffset = newOffset;

            applySyncOffset(newVal);

        let lastInputValue = 0; // State tracker

        // Handles manually typing or clicking the up/down arrows inside the box
        subOffset.addEventListener('input', (e) => {
            let rawNew = parseFloat(e.target.value) || 0;
            let rawOld = parseFloat(lastInputValue) || 0;

            let step = parseFloat(subOffset.step) || 0.1;
            let newOffset;
            
            // If the box changed by exactly 1 step, the user clicked a native spinner arrow.
            // We apply logical + or - regardless of what absolute value the box is displaying.
            if (Math.abs(Math.abs(diff) - step) < 0.001) {

            } else {

                }

        videoPlayer.addEventListener('loadedmetadata', function() {
            nativeWidth = this.videoWidth;
            nativeHeight = this.videoHeight;

            updateSliderMax();
            
            const dpr = window.devicePixelRatio || 1;
            const targetScale = (window.innerHeight * 0.70 * dpr) / nativeHeight;
            const clampedScale = Math.max(sizeSlider.min, Math.min(sizeSlider.max, targetScale)).toFixed(2);
            
            sizeSlider.value = clampedScale;
            updateVideoSize(clampedScale);

            // Fetch volume state on load instead of defaulting to 100%
            const currentVol = parseFloat(volumeSlider.value);

            `;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                const source = audioCtx.createMediaElementSource(audioPlayer);
                gainNode = audioCtx.createGain();

            `;

        function manageAmbientState() {

            } else if (videoPlayer.readyState > 0) {

        function resizeAmbientCanvas() {

        function drawAmbientFrame() {
            if (!nativeWidth || !nativeHeight || videoPlayer.readyState === 0) return;

            const cropTopPx = parseFloat(cropTop.value) || 0;
            const cropBotPx = parseFloat(cropBottom.value) || 0;
            const cropLeftPx = parseFloat(cropLeft.value) || 0;
            const cropRightPx = parseFloat(cropRight.value) || 0;

            const inset = 3;
            const srcX = cropLeftPx + inset;
            const srcY = cropTopPx + inset;
            const srcW = Math.max(1, nativeWidth - cropLeftPx - cropRightPx - (inset * 2));
            const srcH = Math.max(1, nativeHeight - cropTopPx - cropBotPx - (inset * 2));

            const cw = ambientCanvas.width;
            const ch = ambientCanvas.height;
            const scale = parseFloat(sizeSlider.value);
            const dpr = window.devicePixelRatio || 1;
            const fw = (nativeWidth * scale) / dpr;
            const fh = (nativeHeight * scale) / dpr;

            const videoScreenLeft = (window.innerWidth / 2) - (fw / 2) + ((cropLeftPx * scale) / dpr);
            const videoScreenTop = (window.innerHeight / 2) - (fh / 2) + ((cropTopPx * scale) / dpr);
            const videoScreenW = ((nativeWidth - cropLeftPx - cropRightPx) * scale) / dpr;
            const videoScreenH = ((nativeHeight - cropTopPx - cropBotPx) * scale) / dpr;

            const mapX = (x) => ((x + 0.1 * window.innerWidth) / (1.2 * window.innerWidth)) * cw;
            const mapY = (y) => ((y + 0.1 * window.innerHeight) / (1.2 * window.innerHeight)) * ch;

            const destX1 = 0; 
            const destY1 = 0;
            const destX2 = Math.max(0, mapX(videoScreenLeft));
            const destY2 = Math.max(0, mapY(videoScreenTop));
            const destX3 = Math.min(cw, mapX(videoScreenLeft + videoScreenW));
            const destY3 = Math.min(ch, mapY(videoScreenTop + videoScreenH));
            const destX4 = cw; 
            const destY4 = ch;

            const dwLeft = destX2 - destX1; 
            const dwCenter = destX3 - destX2; 
            const dwRight = destX4 - destX3;
            const dhTop = destY2 - destY1; 
            const dhCenter = destY3 - destY2; 
            const dhBottom = destY4 - destY3;

            ambientCtx.globalAlpha = isFirstFrame ? 1.0 : 0.10;

            const sx1 = srcX;
            const sy1 = srcY;
            const sx2 = srcX + srcW - 1;
            const sy2 = srcY + srcH - 1;

            if (dhTop > 0) {
                if (dwLeft > 0) ambientCtx.drawImage(videoPlayer, sx1, sy1, 1, 1, destX1, destY1, dwLeft, dhTop);
                if (dwCenter > 0) ambientCtx.drawImage(videoPlayer, sx1, sy1, srcW, 1, destX2, destY1, dwCenter, dhTop);
                if (dwRight > 0) ambientCtx.drawImage(videoPlayer, sx2, sy1, 1, 1, destX3, destY1, dwRight, dhTop);
            }
            if (dhCenter > 0) {
                if (dwLeft > 0) ambientCtx.drawImage(videoPlayer, sx1, sy1, 1, srcH, destX1, destY2, dwLeft, dhCenter);
                if (dwCenter > 0) ambientCtx.drawImage(videoPlayer, sx1, sy1, srcW, srcH, destX2, destY2, dwCenter, dhCenter);
                if (dwRight > 0) ambientCtx.drawImage(videoPlayer, sx2, sy1, 1, srcH, destX3, destY2, dwRight, dhCenter);
            }
            if (dhBottom > 0) {
                if (dwLeft > 0) ambientCtx.drawImage(videoPlayer, sx1, sy2, 1, 1, destX1, destY3, dwLeft, dhBottom);
                if (dwCenter > 0) ambientCtx.drawImage(videoPlayer, sx1, sy2, srcW, 1, destX2, destY3, dwCenter, dhBottom);
                if (dwRight > 0) ambientCtx.drawImage(videoPlayer, sx2, sy2, 1, 1, destX3, destY3, dwRight, dhBottom);
            }
            isFirstFrame = false;
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            if (h > 0) return `${h}:${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
            return `${m}:${s < 10 ? '0' : ''}${s}`;

            // Anti-Drift and Anti-Silence Engine

        seekSlider.addEventListener('mousedown', () => seekSlider.isDragging = true);
        seekSlider.addEventListener('mouseup', () => seekSlider.isDragging = false);
        seekSlider.addEventListener('touchstart', () => seekSlider.isDragging = true, {passive: true});
        seekSlider.addEventListener('touchend', () => seekSlider.isDragging = false);
        seekSlider.addEventListener('input', (e) => {
            const seekTime = (parseFloat(e.target.value) / 100) * videoPlayer.duration;
            videoPlayer.currentTime = seekTime;
            audioPlayer.currentTime = seekTime;
            timeDisplay.innerText = `${formatTime(seekTime)} / ${formatTime(videoPlayer.duration)}`;
        });

        btnFullscreen.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Fullscreen error: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        });

        function updateVideoSize(scale) {
            if (videoPlayer.readyState === 0) return;
            if (nativeWidth) {
                const dpr = window.devicePixelRatio || 1;
                const fw = (nativeWidth * scale) / dpr;
                const fh = (nativeHeight * scale) / dpr;

                videoPlayer.style.width = fw + 'px';
                videoPlayer.style.height = fh + 'px';
                scaleValue.innerText = parseFloat(scale).toFixed(2);
                
                const canvasW = window.innerWidth * 1.2;
                const canvasH = window.innerHeight * 1.2;
                const vwReal = videoPlayer.videoWidth || nativeWidth || 1;
                const vhReal = videoPlayer.videoHeight || nativeHeight || 1;

                const cT = (parseFloat(cropTop.value) || 0) / vhReal;
                const cB = (parseFloat(cropBottom.value) || 0) / vhReal;
                const cL = (parseFloat(cropLeft.value) || 0) / vwReal;
                const cR = (parseFloat(cropRight.value) || 0) / vwReal;

                const videoLeft = (canvasW / 2) - (fw / 2);
                const videoTop = (canvasH / 2) - (fh / 2);
                const holeLeft = videoLeft + (fw * cL);
                const holeRight = videoLeft + fw - (fw * cR);
                const holeTop = videoTop + (fh * cT);
                const holeBottom = videoTop + fh - (fh * cB);

                const visibleW = holeRight - holeLeft;
                const visibleH = holeBottom - holeTop;
                
                const centerX = (holeLeft + (visibleW / 2)) / canvasW * 100;
                const centerY = (holeTop + (visibleH / 2)) / canvasH * 100;

                const fadeScale = 2.2; 
                const radiusX = (visibleW / 2) * fadeScale;
                const radiusY = (visibleH / 2) * fadeScale;
                const innerStop = (1 / fadeScale) * 100;

                const radialMask = `radial-gradient(${radiusX}px ${radiusY}px at ${centerX}% ${centerY}%, black 0%, black ${innerStop}%, transparent 100%)`;

                ambientCanvas.style.webkitMaskImage = radialMask;
                ambientCanvas.style.maskImage = radialMask;
                ambientCanvas.style.webkitMaskComposite = ''; 
                ambientCanvas.style.maskComposite = '';
            }
        }

        function updateSliderMax() {
            if (nativeWidth && nativeHeight) {
                const dpr = window.devicePixelRatio || 1;
                const scaleX = (window.innerWidth * dpr) / nativeWidth;
                const scaleY = (window.innerHeight * dpr) / nativeHeight;
                currentFitScale = Math.min(scaleX, scaleY);
                
                sizeSlider.min = Math.min(0.5, currentFitScale).toFixed(2);
                sizeSlider.max = Math.max(3, currentFitScale).toFixed(2);
                
                if (parseFloat(sizeSlider.value) > parseFloat(sizeSlider.max)) {
                    sizeSlider.value = sizeSlider.max;
                    updateVideoSize(sizeSlider.value);
                } else if (parseFloat(sizeSlider.value) < parseFloat(sizeSlider.min)) {
                    sizeSlider.value = sizeSlider.min;
                    updateVideoSize(sizeSlider.value);
                }
            }
        }

        window.addEventListener('resize', () => {
            updateSliderMax();
        });

        sizeSlider.addEventListener('input', function(e) {
            updateVideoSize(e.target.value);
        });

        sizeSlider.addEventListener('wheel', function(e) {
            e.preventDefault();
            e.deltaY < 0 ? this.stepUp() : this.stepDown();
            this.dispatchEvent(new Event('input'));
        });

        let isMuted = false;
        let preMuteVolume = 1;

        function updateMuteUI(muted) {
            const waves = document.getElementById('volWaves');
            const muteLine = document.getElementById('volMuteLine');
            if (muted) {
                if (waves) waves.style.display = 'none';
                if (muteLine) muteLine.style.display = 'block';
                muteIcon.style.opacity = '0.5';
            } else {
                if (waves) waves.style.display = 'block';
                if (muteLine) muteLine.style.display = 'none';
                muteIcon.style.opacity = '1';
            }
        }

        muteIcon.addEventListener('click', () => {
            if (!isMuted) {
                preMuteVolume = volumeSlider.value;
                volumeSlider.value = 0;
            } else {
                volumeSlider.value = preMuteVolume > 0 ? preMuteVolume : 1; 
            }
            volumeSlider.dispatchEvent(new Event('input')); 
        });

        volumeSlider.addEventListener('input', function(e) {
            const val = parseFloat(e.target.value);
            volumeValue.innerText = Math.round(val * 100);
            
            if (gainNode) {
                gainNode.gain.value = val;
            } else {
                audioPlayer.volume = Math.min(1, val);
            }
            
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            if (val > 0 && isMuted) {
                isMuted = false;
                updateMuteUI(false);
            } else if (val === 0 && !isMuted) {
                isMuted = true;
                updateMuteUI(true);
            }
        });

        volumeSlider.addEventListener('wheel', function(e) {
            e.preventDefault();
            e.deltaY < 0 ? this.stepUp(5) : this.stepDown(5);
            this.dispatchEvent(new Event('input'));
        });

        // Allow scrolling anywhere over the video player to adjust the volume
        document.addEventListener('wheel', function(e) {
            // Ignore if the mouse is hovering over the top or bottom UI panels
            if (controlBar.contains(e.target) || bottomControlBar.contains(e.target)) return;
            
            e.preventDefault();
            e.deltaY < 0 ? volumeSlider.stepUp(5) : volumeSlider.stepDown(5);
            volumeSlider.dispatchEvent(new Event('input'));
            
            // Wake up the UI so the user can see the volume changing
            resetIdleTimer(e); 
        }, { passive: false });

        btnFit.addEventListener('click', function() {
            if (nativeWidth && nativeHeight) {
                sizeSlider.value = currentFitScale;
                updateVideoSize(currentFitScale);
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.target.tagName === 'INPUT') return;

            if (e.code === 'Space') {
                e.preventDefault();
                if (videoPlayer.paused && videoPlayer.readyState > 0) {
                    videoPlayer.play();
                    audioPlayer.play().catch(err => console.log(err));
                } else if (!videoPlayer.paused) {
                    videoPlayer.pause();
                }
            } else if (e.code === 'ArrowLeft') {
                videoPlayer.currentTime -= 5;
            } else if (e.code === 'ArrowRight') {
                videoPlayer.currentTime += 5;
            }
        });

        function resetIdleTimer(e) {
            document.body.style.cursor = 'default'; 
            clearTimeout(hideTimeout);
            
            const isTopCenterEdge = e && e.clientY <= 60 && e.clientX > window.innerWidth * 0.3 && e.clientX < window.innerWidth * 0.7;
            const isBottomCenterEdge = e && e.clientY >= window.innerHeight - 70 && e.clientX > window.innerWidth * 0.2 && e.clientX < window.innerWidth * 0.8;
            const isOverControlBar = e && controlBar.contains(e.target);
            const isOverBottomBar = e && bottomControlBar.contains(e.target);
            const isOverVideoArea = !e || e.target === videoPlayer || playOverlay.contains(e.target) || isOverControlBar || isOverBottomBar || isTopCenterEdge || isBottomCenterEdge;
            
            if (isOverVideoArea) {
                controlBar.classList.remove('hidden');
                bottomControlBar.classList.remove('hidden');
            }
            
            if (!isOverControlBar && !isOverBottomBar) {
                hideTimeout = setTimeout(() => {
                    controlBar.classList.add('hidden');
                    bottomControlBar.classList.add('hidden');
                    document.body.style.cursor = 'none'; 
                    if (typeof cropControls !== 'undefined') cropControls.style.display = 'none';
                }, 1500); 
            }
        }

        document.addEventListener('mousemove', resetIdleTimer);
        resetIdleTimer();

        document.addEventListener('mousedown', function(e) {
            const isOverControlBar = controlBar.contains(e.target);
            const isOverBottomBar = bottomControlBar.contains(e.target);
            const isOverVideo = e.target === videoPlayer;
            const isOverOverlay = playOverlay.contains(e.target);
            
            if (!isOverControlBar && !isOverBottomBar && !isOverVideo && !isOverOverlay) {
                controlBar.classList.add('hidden');
                bottomControlBar.classList.add('hidden');
                document.body.style.cursor = 'none';
                if (typeof cropControls !== 'undefined') cropControls.style.display = 'none';
            }
        });
</script>
